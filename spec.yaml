id: etd

requirements:
  # DEV ONLY: ecoscope-platform stays a normal published conda dependency
  # here even though we're testing unpublished code (ecoscope@zak/mcp-bbmm) -
  # the unpublished branch is shadowed in via PYTHONPATH at compile/run time
  # instead of listed here as an editable-local requirement. wt-compiler's
  # own subprocess calls (the pypi install step and the wt-registry
  # task-discovery scan) inherit the calling shell's environment, so a
  # PYTHONPATH set before invoking it reaches both compile-time task
  # discovery and later runtime execution - `import ecoscope` resolves to the
  # local checkout in both, without the slower/more fragile full
  # editable-path conda+pypi solve an in-place `path:`/`editable: true`
  # requirement would need (and without a matching python-version pin -
  # a real conda ecoscope-platform constrains that on its own).
  #
  # Compile and run with:
  #   PYTHONPATH=/absolute/path/to/local/ecoscope pixi run compile-etd
  #   PYTHONPATH=/absolute/path/to/local/ecoscope pixi run <workflow CLI/tests>
  #
  # Revert to a plain published pin (no PYTHONPATH needed) once a released
  # ecoscope-platform version actually contains this code.
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  # TEMPORARY: back to editable-local while testing compute_fitted_view_state
  # (branch zak/mcp-bbmm in ecoscope-workflow-task-library) - was pinned to
  # published 0.1.0rc21 before this. Re-pin to a new published version once a
  # release is cut with this change.
  - name: ecoscope-workflows-ext-custom
    path: /Users/zak/Documents/w-dynamics/ecoscope-workflow-task-library/src/ecoscope-workflows-ext-custom
    editable: true

  # TEMPORARY, tied to the ecoscope-workflows-ext-custom entry above: that
  # package's own pyproject.toml pins setuptools<=81.0.0 for its own pypi
  # build, but wt-compiler doesn't carry that pin into the generated
  # workflow's pixi.toml, so the conda solver picks whatever's newest on
  # conda-forge (83.x/84.x as of writing) and pixi install's pypi-layer solve
  # then fails on the contradiction. Remove once ecoscope-workflows-ext-custom
  # is back to a normal published conda pin (no pypi-layer solve at all then).
  - name: setuptools
    version: "<=81.0.0"
    channel: conda-forge

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

rjsf-overrides:
  properties:
    Subject Group.properties.subject_observations.properties.subject_group_name.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_client.properties.data_source.properties.name
    Group Data.properties.groupers.properties.groupers.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: spatial_feature_group
          depends_on: properties.er_client.properties.data_source.properties.name
    Group Data.properties.groupers.properties.groupers.description: ""
    Group Data.properties.groupers.properties.groupers.default:
      - index_name: subject_name
    Group Data.properties.groupers.properties.groupers.items.anyOf:
      - $ref: "#/$defs/TemporalGrouper"
      - $ref: "#/$defs/ValueGrouper"
    Filter Data.properties.subject_filters.title: ""
    Map Style.properties.home_range_opacity.properties.opacity.default: 0.7
    Map Style.properties.home_range_legend_title.properties.var.title: Legend Title
    Map Style.properties.home_range_legend_title.properties.var.description: >-
      The title shown above the percentile color legend on the map.
    Map Style.properties.home_range_legend_title.properties.var.default: Range Percentile
    persist_home_range_pct_grouped.description: >-
      File formats to export the home range percentile-area data in.
    persist_home_range_pct_grouped.properties.filetypes.ecoscope:advanced: true
    persist_home_range_pct_grouped.properties.filetypes.default:
      - geoparquet
      - csv
    persist_home_range_pct_grouped.properties.filetypes.items.enum:
      # geoparquet (not plain parquet) - this data has a geometry column
      # (the percentile hull/isopleth polygons), which plain parquet doesn't
      # preserve natively.
      - csv
      - geoparquet
  $defs:
    # Restrict grouping to subject attributes that actually exist on the trajectory
    # (after the rename step below), matching the subject-tracking workflow.
    ValueGrouper.properties.index_name.oneOf:
      - const: subject_name
        title: Subject Name
      - const: subject_subtype
        title: Subject Subtype
      - const: subject_sex
        title: Subject Sex
    # grid_cell_size_settings/speed_settings/expansion_factor_settings/
    # location_error_settings/time_step_settings/max_data_gap_settings (see
    # _home_range.py/_bbmm.py's module comments, ADDENDUM 2) are single-field
    # object wrappers that exist purely to work
    # around RJSF's field-blanking-on-switch-back bug. Pydantic emits
    # `{"allOf": [{"$ref": ...}], "default": ..., "title": ...}` for each of
    # these (a model-typed field with a title override or other Field(...)
    # metadata alongside it), but RJSF's sanitizeDataForNewSchema only ever
    # resolves a BARE `{"$ref": ...}`, never one nested inside `allOf` - so
    # without this override, each field's own `type` is never resolved to
    # `object`, and it falls through to the untyped-scalar (tombstone-prone)
    # path regardless of the wrapping. Adding `type`/`properties` directly
    # here (duplicating each wrapper model's own real schema, hand-copied
    # from the compiled rjsf.json, not auto-derived) makes
    # sanitizeDataForNewSchema find them directly without ever needing to
    # follow the (still-present but now irrelevant) $ref. Tried injecting
    # this from the Python side instead (json_schema_extra) - confirmed via
    # direct reproduction that it's unreliable there for two separate
    # reasons: pydantic's own schema generator raises on any raw "$ref"
    # string placed inside json_schema_extra (blocking
    # grid_cell_size_settings, whose inner field is itself a $ref-bearing
    # anyOf), and separately, pydantic silently drops an injected "type" key
    # specifically when the referencing field has no real python default
    # (blocking speed_settings/location_error_settings, which need to stay
    # genuinely required for backend disambiguation). Overriding here
    # instead, on the final assembled schema, sidesteps both.
    EtdMethodArgs.properties.grid_cell_size_settings.type: object
    EtdMethodArgs.properties.grid_cell_size_settings.properties:
      auto_scale_or_custom_cell_size:
        anyOf:
          - $ref: "#/$defs/AutoScaleGridCellSize"
          - $ref: "#/$defs/CustomGridCellSize"
        default:
          auto_scale_or_custom: "Auto-scale"
        ecoscope:advanced: true
        title: Grid Cell Size
    EtdMethodArgs.properties.speed_settings.type: object
    EtdMethodArgs.properties.speed_settings.properties:
      max_speed_factor:
        default: 1.05
        description: >-
          Caps the subject's assumed top speed as a multiple of the fastest speed
          actually observed in the data - higher values allow more distant possible
          locations between consecutive fixes.
        title: Max Speed Factor (Kilometers per Hour)
        type: number
    EtdMethodArgs.properties.expansion_factor_settings.type: object
    EtdMethodArgs.properties.expansion_factor_settings.properties:
      expansion_factor:
        default: 1.3
        description: >-
          Pads the calculation grid beyond the trajectory's own bounding box, so the
          density surface has room to taper off naturally instead of being cut off at
          the edge.
        ecoscope:advanced: true
        title: Shape Buffer Expansion Factor
        type: number
    McpMethodArgs.properties.show_relocations_settings.type: object
    McpMethodArgs.properties.show_relocations_settings.properties:
      show_relocations:
        default: false
        description: >-
          Overlay the individual relocation points on the map. Off by default - dense point
          clouds can obscure the home range polygon underneath.
        title: Show Relocations
        type: boolean
    BbmmMethodArgs.properties.location_error_settings.type: object
    BbmmMethodArgs.properties.location_error_settings.properties:
      location_error:
        default: 20.0
        description: >-
          Typical GPS collar accuracy - the standard deviation of a single fix's
          positional error.
        title: GPS Location Error (meters)
        type: number
    BbmmMethodArgs.properties.time_step_settings.type: object
    BbmmMethodArgs.properties.time_step_settings.properties:
      time_step_seconds:
        default: 60.0
        description: >-
          How finely each movement segment is broken into steps when computing the
          density surface - smaller values are more precise but slower to compute.
        ecoscope:advanced: true
        title: Bridge Integration Time Step (seconds)
        type: number
    BbmmMethodArgs.properties.expansion_factor_settings.type: object
    BbmmMethodArgs.properties.expansion_factor_settings.properties:
      expansion_factor:
        default: 1.3
        description: >-
          Pads the calculation grid beyond the trajectory's own bounding box, so the
          density surface has room to taper off naturally instead of being cut off at
          the edge.
        ecoscope:advanced: true
        title: Shape Buffer Expansion Factor
        type: number
    BbmmMethodArgs.properties.max_data_gap_settings.type: object
    BbmmMethodArgs.properties.max_data_gap_settings.properties:
      max_data_gap_seconds:
        default: 14400.0
        description: >-
          Fixes separated by a gap this long or longer are excluded rather than
          modeled as one highly uncertain bridge - a long gap usually reflects a data
          outage (e.g. a collar dropout), not real movement uncertainty.
        ecoscope:advanced: true
        title: Maximum Data Gap (seconds)
        type: number
  uiSchema:
    # Positional, matching the narrowed schema anyOf order above: TemporalGrouper,
    # ValueGrouper (SpatialGrouper removed).
    Group Data.groupers.groupers.items.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
    base_map_defs.base_maps.items.ui:options.label: false
    # Hide the redundant fieldset legend (e.g. "Elliptical Time-Density (ETD)") that
    # repeats what the Method dropdown above it already shows selected.
    #
    # Grid Cell Size (auto_scale_or_custom_cell_size, ETD-only) is different: its
    # own "Grid Cell Size" label is NOT redundant with anything else on screen (it's
    # the only caption naming what the Auto-scale/Customize selector below it is
    # for), so it's deliberately left alone/visible - do not add a label:false
    # override for it directly. What IS truly redundant, one level deeper: each
    # matched branch (AutoScaleGridCellSize/CustomGridCellSize) has its own
    # `auto_scale_or_custom` const property (title also "Grid Cell Size") - a
    # fixed, non-editable discriminator value that just repeats what the
    # Auto-scale/Customize selector already shows, so THAT one is hidden entirely
    # (ui:widget: hidden, not just label:false - a const field carries no real
    # choice to preserve, unlike the selector itself).
    #
    # speed_settings/show_relocations_settings/location_error_settings/
    # time_step_settings/max_data_gap_settings/grid_cell_size_settings/
    # expansion_factor_settings (see _home_range.py/_bbmm.py's module
    # comments) are single-field object wrappers that exist purely to work
    # around RJSF's field-blanking-on-switch-back bug - not a meaningful
    # grouping. RJSF renders an object's own title as a big fieldset-style
    # header (unlike a scalar field's normal-sized label), so each WRAPPER's
    # own label is hidden here (ui:options.label: false, on the wrapper
    # itself) and the INNER field's own label is left visible instead - its
    # normal scalar rendering keeps the same font size as every other field,
    # matching how these looked before wrapping. grid_cell_size_settings is
    # the one exception: its inner field (auto_scale_or_custom_cell_size)
    # already carried its own "Grid Cell Size" title before any of this
    # wrapping existed (see the comment above), so it's untouched here - only
    # the new outer wrapper's label is hidden.
    #
    # This array is positional, matching the schema's own anyOf order exactly:
    # McpMethodArgs (index 0), EtdMethodArgs (index 1, has the nested Grid Cell
    # Size override), BbmmMethodArgs (index 2).
    Home Range Method.home_range_args.args.anyOf:
      - ui:options:
          label: false
        show_relocations_settings:
          ui:options:
            label: false
      - ui:options:
          label: false
        speed_settings:
          ui:options:
            label: false
        expansion_factor_settings:
          ui:options:
            label: false
        grid_cell_size_settings:
          ui:options:
            label: false
          auto_scale_or_custom_cell_size:
            anyOf:
              - ui:options:
                  label: false
                auto_scale_or_custom:
                  ui:widget: hidden
              - ui:options:
                  label: false
                auto_scale_or_custom:
                  ui:widget: hidden
      - ui:options:
          label: false
        location_error_settings:
          ui:options:
            label: false
        time_step_settings:
          ui:options:
            label: false
        expansion_factor_settings:
          ui:options:
            label: false
        max_data_gap_settings:
          ui:options:
            label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y"

  # ── Fetch & Prepare Trajectory ────────────────────────────────────────────
  #
  # `subject_group_name` is left unset here so it becomes a live-populated
  # dropdown of real subject groups from the connected EarthRanger server (see
  # the `ecoscope:transform` override above), instead of a hand-typed string.

  - title: Subject Group
    type: task-group
    description: Choose the EarthRanger subject group to compute a home range for.
    tasks:
      - name: null
        id: subject_observations
        task: get_subjectgroup_observations
        partial:
          filter: clean
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          raise_on_empty: true
          include_details: false
          include_subjectsource_details: false

  - title: Filter Data
    type: task-group
    description: ""
    tasks:
      - name: Filters
        id: subject_filters
        task: ecoscope.platform.tasks.config.set_traj_filters

  - id: bounding_box
    task: ecoscope.platform.tasks.config.get_bounding_box
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - id: filter_point_coords
    task: ecoscope.platform.tasks.config.get_filter_point_coords
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - id: segment_filter
    task: ecoscope.platform.tasks.config.get_segment_filter
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - name: Filter by Bounding Box
    id: subject_obs_filtered
    task: apply_reloc_coord_filter
    partial:
      df: ${{ workflow.subject_observations.return }}
      bounding_box: ${{ workflow.bounding_box.return }}
      filter_point_coords: null
      roi_gdf: null
      roi_name: null
      reset_index: false

  # ── Grouping ───────────────────────────────────────────────────────────────
  #
  # Optional: split the trajectory (by subject name/subtype/sex, by time period,
  # and/or by a spatial feature group) so ETD is computed once per group instead
  # of pooling every individual in the subject group together. Left unset,
  # `set_groupers` returns `AllGrouper` and `split_groups` passes the whole
  # trajectory through as a single group - matching subject-tracking.
  #
  # `resolved_groupers` only does real work for spatial (zone-based) groupers -
  # it fetches the actual polygon boundaries so `add_spatial_index` can assign
  # each trajectory point to a zone. For plain category/time groupers it's a
  # passthrough (verified directly against `resolve_spatial_feature_groups_for_
  # spatial_groupers`'s source: it only mutates `SpatialGrouper` entries).

  - title: Group Data
    type: task-group
    description: >-
      Optionally group the data by subject, time period, or spatial feature group to
      compute the home range separately per group.
    tasks:
      - id: groupers
        task: set_groupers

      - id: spatial_group_ids
        task: extract_spatial_grouper_feature_group_names
        partial:
          groupers: ${{ workflow.groupers.return }}

      - id: fetch_spatial_feature_groups
        task: get_spatial_features_group
        partial:
          client: ${{ workflow.er_client.return }}
        map:
          argnames: spatial_features_group_name
          argvalues: ${{ workflow.spatial_group_ids.return }}

      - id: resolved_groupers
        task: resolve_spatial_feature_groups_for_spatial_groupers
        partial:
          groupers: ${{ workflow.groupers.return }}
          spatial_feature_groups: ${{ workflow.fetch_spatial_feature_groups.return }}

  - name: Transform Observations to Relocations
    id: subject_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.subject_obs_filtered.return }}
      relocs_columns:
        - groupby_col
        - fixtime
        - junk_status
        - geometry
        - extra__subject__name
        - extra__subject__subject_subtype
        - extra__subject__sex
      filter_point_coords: ${{ workflow.filter_point_coords.return }}

  - name: Convert Relocations to Trajectory
    id: subject_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.subject_reloc.return }}
      trajectory_segment_filter: ${{ workflow.segment_filter.return }}

  - name: Add Temporal Index to Trajectory
    id: traj_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.subject_traj.return }}
      time_col: segment_start
      groupers: ${{ workflow.resolved_groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Add Spatial Index to Trajectory
    id: traj_spatial_index
    task: add_spatial_index
    partial:
      gdf: ${{ workflow.traj_temporal_index.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Rename Subject Columns for Grouping
    id: subject_traj_named
    task: map_columns
    partial:
      df: ${{ workflow.traj_spatial_index.return }}
      drop_columns: []
      retain_columns: []
      rename_columns:
        extra__name: subject_name
        extra__subject_subtype: subject_subtype
        extra__sex: subject_sex
      raise_if_not_found: true

  - name: Split Trajectory by Group
    id: subject_traj_groups
    task: split_groups
    partial:
      df: ${{ workflow.subject_traj_named.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Map Base Layers
    id: base_map_defs
    task: set_base_maps

  # ── Home Range (ETD, MCP, or BBMM, user-selectable) ───────────────────────
  #
  # SUPERSEDED (kept for history, see below for the current design):
  # # A single "Method" field lets the user pick ETD, MCP, or BBMM; only the
  # # selected method's own settings are present in the submitted data - no
  # # shared discriminator field, EtdMethodArgs/McpMethodArgs/BbmmMethodArgs are
  # # told apart structurally via disjoint field names (see _home_range.py).
  # # (A real `method` discriminator + allOf/if/then was tried instead, to avoid
  # # anyOf's known "switching methods wipes previously-entered values" quirk -
  # # live-tested and found that allOf/if/then adding brand-new properties not
  # # already in the base schema doesn't render fields at all in this app's
  # # actual RJSF setup, so reverted back to the disjoint-property anyOf pattern,
  # # which is proven to work - it's the same one icf/workflows/patrol_events
  # # already uses in production.)
  #
  # A single "Method" field lets the user pick ETD, MCP, or BBMM; only the
  # selected method's own settings are present in the submitted data.
  # EtdMethodArgs/McpMethodArgs/BbmmMethodArgs now share property names (crs,
  # percentiles, expansion_factor) where the same concept applies across
  # variants, plus each keep one genuinely-required field of their own
  # (speed_settings/location_error_settings, or no required field at all for
  # MCP) for branch disambiguation - see _home_range.py's module comment for
  # the full explanation of why this is safe for RJSF's anyOf matching AND is
  # what actually fixes "switching methods away and back blanks previously-
  # entered values", a real upstream RJSF bug confirmed by porting and
  # executing its actual source (not just the disjoint-name workaround the
  # comment above describes, which never fixed that bug - it just avoided a
  # different, matching-ambiguity problem). call_home_range_from_args
  # dispatches to whichever method was chosen and returns the same
  # percentile/geometry/area_sqkm shape either way, so the map/table below
  # don't need to know or care which method actually ran.

  - title: Home Range Method
    type: task-group
    description: Choose which home-range estimation method to compute for the map and table.
    tasks:
      - id: home_range_args
        task: set_home_range_args

  # MCP/BBMM have no ETD-shaped raster/UD surface, so this (and etd_raster below,
  # via its own default any_dependency_skipped condition catching this task's
  # SKIP_SENTINEL output) is skipped entirely when a non-ETD method is selected -
  # rather than silently falling back to ETD's defaults and spending real compute
  # on a file nobody configured or asked for.
  - name: Derive ETD Raster Parameters
    id: etd_raster_params
    task: get_etd_raster_params_from_args
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - any_is_non_etd_method_args
    partial:
      args: ${{ workflow.home_range_args.return }}

  - name: Generate ETD Raster per Group (GeoTIFF)
    id: etd_raster
    task: ecoscope_workflows_ext_custom.tasks.analysis.generate_etd_raster
    partial:
      combined_params: ${{ workflow.etd_raster_params.return }}
      filename: etd_home_range_raster
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    map:
      argnames:
        - group_key
        - trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  # Mirrors etd_raster_params/etd_raster above - skipped entirely unless BBMM is
  # selected. Unlike ETD, no extra combined-params fields are needed (nodata/band_count
  # aren't user-configurable for BBMM), so get_bbmm_raster_params_from_args just
  # narrows the type rather than building a separate combined-params object.
  - name: Derive BBMM Raster Parameters
    id: bbmm_raster_params
    task: get_bbmm_raster_params_from_args
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - any_is_non_bbmm_method_args
    partial:
      args: ${{ workflow.home_range_args.return }}

  - name: Generate BBMM Raster per Group (GeoTIFF)
    id: bbmm_raster
    task: generate_bbmm_raster
    partial:
      combined_params: ${{ workflow.bbmm_raster_params.return }}
      filename: bbmm_home_range_raster
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    map:
      argnames:
        - group_key
        - trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  - name: Derive Relocations per Group (for MCP points overlay)
    id: subject_reloc_groups
    task: convert_trajectory_to_relocations
    mapvalues:
      argnames: trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  - name: Calculate Home Range Percentiles per Group
    id: home_range_percentiles_grouped
    task: call_home_range_from_args
    partial:
      args: ${{ workflow.home_range_args.return }}
    mapvalues:
      argnames: trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  # Map-rendering settings, kept separate from Home Range Method above so
  # algorithm/statistical settings (per-method) aren't mixed in with purely
  # cosmetic ones (shared across all three methods).
  - title: Map Style
    type: task-group
    description: ""
    tasks:
      - id: home_range_legend_title
        task: set_string_var

      - id: home_range_opacity
        task: set_layer_opacity

  - name: Get Stroked Setting
    id: home_range_stroked
    task: get_stroked_from_args
    partial:
      args: ${{ workflow.home_range_args.return }}

  # Always true for MCP, always false for ETD/BBMM (get_rings_correction_from_args
  # derives it from the selected method) - not user-configurable. MCP's percentile
  # hulls are cumulative/nested, so the correction always applies there; ETD/BBMM's
  # isopleths come from a continuous density surface, so it never applies there.
  - name: Get Rings Correction Setting
    id: home_range_rings_correction
    task: get_rings_correction_from_args
    partial:
      args: ${{ workflow.home_range_args.return }}

  # ── MCP points overlay ──────────────────────────────────────────────────
  #
  # relocations_for_points_overlay returns the real relocations for MCP (the
  # literal point subset its hull was computed from) when MCP's own
  # show_relocations_settings.show_relocations is enabled, or an empty
  # GeoDataFrame otherwise (ETD/BBMM never show points - a density surface
  # has no equivalent discrete subset) - an empty GeoJSON layer renders
  # nothing, so this stays a no-op without any skipif/branching.

  - name: Filter Points to MCP Only
    id: home_range_points_gdf
    task: relocations_for_points_overlay
    partial:
      args: ${{ workflow.home_range_args.return }}
    mapvalues:
      argnames: relocations_gdf
      argvalues: ${{ workflow.subject_reloc_groups.return }}

  - name: Reproject Points for Map (WGS84)
    id: home_range_points_wgs84
    task: convert_crs
    partial:
      crs: EPSG:4326
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.home_range_points_gdf.return }}

  - name: Home Range Points Layer
    id: home_range_points_layer
    task: create_geojson_layer
    partial:
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [0, 0, 0]
        get_line_color: [0, 0, 0]
        get_line_width: 0
        get_point_radius: 1.5
        point_radius_units: pixels
        point_radius_min_pixels: 1
        opacity: 0.8
      legend: null
      # Explicit, not null - null relies on draw_map treating "no tooltip_columns
      # entry for this layer" as "show all properties", but it actually omits
      # the layer from the tooltip widget's config entirely, so nothing shows
      # on hover at all. fixtime is the only property this GeoDataFrame carries
      # (see Trajectory.to_relocations()), so it's also the only one worth
      # naming here.
      tooltip_columns:
        - fixtime
      zoom: false
      data_url: null
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.home_range_points_wgs84.return }}

  # Per-group files, hash-named to match the dashboard's per-view "Files" tab
  # (same CompositeFilter -> hash encoding the FE uses for `views_json` keys),
  # in addition to the single combined table above.
  - name: Export Percentiles
    id: persist_home_range_pct_grouped
    task: persist_grouped_dfs_for_results_download
    partial:
      grouped_dfs: ${{ workflow.home_range_percentiles_grouped.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: home_range_percentiles
      sanitize: false

  # ── ETD Home Range Map + Table (per group, merged into dashboard widgets) ──
  #
  # Mirrors subject-tracking's td_map_widget/td_grouped_map_widget pattern: draw
  # each group's map/table separately, persist each with an auto-generated (hash
  # based) filename since these are dashboard-only artifacts, wrap each as a
  # single-view widget, then merge all views into one widget with a view per
  # group - matching the `merge_widget_views` mechanism exactly.

  - title: Home Range Map
    type: task-group
    description: Percentile choropleth map of the home range, colored by isopleth level.
    tasks:
      - name: Apply Rings Correction (if enabled)
        id: home_range_pct_rings
        task: apply_rings_correction_if_enabled
        partial:
          enabled: ${{ workflow.home_range_rings_correction.return }}
        mapvalues:
          argnames: percentiles_gdf
          argvalues: ${{ workflow.home_range_percentiles_grouped.return }}

      - name: Cast Percentile Column
        id: home_range_pct_to_string
        task: convert_column_values_to_string
        partial:
          columns:
            - percentile
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.home_range_pct_rings.return }}

      - name: Color Map - Home Range Percentiles
        id: home_range_pct_colormap
        task: apply_color_map
        partial:
          input_column_name: percentile
          colormap: RdYlGn_r
          output_column_name: percentile_color
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.home_range_pct_to_string.return }}

      - name: Reproject Home Range Percentiles for Map (WGS84)
        id: home_range_pct_wgs84
        task: convert_crs
        partial:
          crs: EPSG:4326
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.home_range_pct_colormap.return }}

      # Area is kept as a real number (not map_values_with_unit's formatted
      # "0.11 km²" string) so downloading the percentile table stays directly
      # usable in another analysis tool - a text-and-number cell would be
      # read back as a string, not a number. The unit lives in the column
      # header ("Area (km²)") instead of a formatted cell value. Left
      # unrounded here since this feeds the map tooltip too (see the
      # Percentile Table group below for the table-only rounded version).
      # - name: Format Area for Display
      #   id: home_range_pct_area_display
      #   task: map_values_with_unit
      #   partial:
      #     input_column_name: area_sqkm
      #     output_column_name: area_sqkm
      #     original_unit: "km²"
      #     new_unit: "km²"
      #     decimal_places: 2
      #   mapvalues:
      #     argnames: df
      #     argvalues: ${{ workflow.home_range_pct_wgs84.return }}

      - name: Rename Percentile/Area for Display
        id: home_range_pct_display
        task: map_columns
        partial:
          drop_columns: []
          retain_columns: []
          rename_columns:
            percentile: Percentile
            area_sqkm: "Area (km²)"
          raise_if_not_found: true
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.home_range_pct_wgs84.return }}

      - name: Home Range Percentile Layer
        id: home_range_pct_layer
        task: create_geojson_layer
        partial:
          layer_style:
            filled: true
            # stroked comes from get_stroked_from_args - true (black outline)
            # for MCP's few large convex hulls, false for ETD/BBMM's many small raster-cell
            # fragments (a black outline on every one looked like a messy quilted mesh).
            # get_line_color/get_line_width are complete no-ops whenever stroked is false.
            stroked: ${{ workflow.home_range_stroked.return }}
            get_fill_color: percentile_color
            get_line_color: [0, 0, 0]
            get_line_width: 2
            opacity: ${{ workflow.home_range_opacity.return }}
          legend:
            title: ${{ workflow.home_range_legend_title.return }}
            label_column: Percentile
            label_suffix: " %"
            color_column: percentile_color
            sort: ascending
          tooltip_columns:
            - Percentile
            - "Area (km²)"
          # false (not true) so draw_map's fit-bounds fallback fires and fits to the
          # union of this layer + home_range_points_layer, rather than fitting to just
          # this layer's bounds and potentially cropping out the MCP points overlay.
          zoom: false
          data_url: null
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.home_range_pct_display.return }}

      - name: Combine Percentile and Points Layers
        id: home_range_combined_layers
        task: groupbykey
        partial:
          iterables:
            - ${{ workflow.home_range_pct_layer.return }}
            - ${{ workflow.home_range_points_layer.return }}

      - name: Compute Fitted Map View per Group
        id: home_range_view_state
        task: compute_fitted_view_state
        partial:
          max_zoom: 15
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.home_range_combined_layers.return }}

      - name: Combine Map Layers and Fitted View per Group
        id: home_range_map_and_view
        task: groupbykey
        partial:
          iterables:
            - ${{ workflow.home_range_combined_layers.return }}
            - ${{ workflow.home_range_view_state.return }}

      - name: Draw Home Range Map per Group
        id: home_range_map
        task: draw_map
        partial:
          tile_layers: ${{ workflow.base_map_defs.return }}
          static: false
          title: null
          output_type: html
          max_zoom: 15
          legend_style:
            placement: bottom-right
        mapvalues:
          argnames: [geo_layers, view_state]
          argvalues: ${{ workflow.home_range_map_and_view.return }}

      - name: Persist Home Range Map (HTML) per Group
        id: persist_home_range_map_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: home_range_map
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.home_range_map.return }}

      - name: Home Range Map Widget Views
        id: home_range_map_widget_views
        task: create_map_widget_single_view
        partial:
          title: "Home Range Map"
        map:
          argnames:
            - view
            - data
          argvalues: ${{ workflow.persist_home_range_map_html.return }}

      - name: Home Range Map Widget
        id: home_range_map_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.home_range_map_widget_views.return }}

  - title: Percentile Table
    type: task-group
    description: Percentile / area table for the home range, as a dashboard widget.
    tasks:
      # Rounds Area to 2 decimal places for a clean on-screen/download look -
      # scoped to the table only, via SQL ROUND (keeps the value numeric,
      # unlike map_values_with_unit's string formatting). The map tooltip
      # (home_range_pct_layer above) intentionally keeps the unrounded value
      # from home_range_pct_display, since it isn't affected by this step.
      - name: Select and Round Percentile Table Columns
        id: home_range_pct_table_columns
        task: apply_sql_query
        partial:
          query: >-
            SELECT "Percentile", ROUND("Area (km²)", 2) AS "Area (km²)" FROM df
          columns:
            - Percentile
            - "Area (km²)"
          sanitize: true
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.home_range_pct_display.return }}

      - id: home_range_pct_table
        task: draw_table
        partial:
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
            hide_header: false
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.home_range_pct_table_columns.return }}

      - name: Persist Home Range Percentile Table (HTML) per Group
        id: persist_home_range_table_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: home_range_percentile_table
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.home_range_pct_table.return }}

      - name: Home Range Percentile Table Widget Views
        id: home_range_table_widget_views
        task: create_plot_widget_single_view
        partial:
          title: "Percentile Table"
        map:
          argnames:
            - view
            - data
          argvalues: ${{ workflow.persist_home_range_table_html.return }}

      - name: Home Range Percentile Table Widget
        id: home_range_pct_table_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.home_range_table_widget_views.return }}

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.home_range_map_widget.return }}
        - ${{ workflow.home_range_pct_table_widget.return }}
      groupers: ${{ workflow.resolved_groupers.return }}
      time_range: ${{ workflow.time_range.return }}
