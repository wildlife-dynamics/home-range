id: etd

requirements:
  - name: ecoscope-platform
    version: ">=2.15.0,<2.18.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc21"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  # Unreleased MCP/home-range-selector work (feature/mcp-home-range branch in ecoscope)
  # isn't published on ecoscope-platform yet, and that checkout is local-only (not
  # shareable) - so for now it's migrated into ecoscope-workflows-ext-wd (see
  # ecoscope_workflows_ext_wd/tasks/_home_range.py) and depended on as an editable
  # local checkout of THAT (shared) repo instead. Once the real code is
  # merged/released in ecoscope, this requirement should be removed and the task
  # references below resolve from ecoscope-platform directly again.
  - name: ecoscope-workflows-ext-wd
    path: /Users/zak/Documents/w-dynamics/wd-partner-tasks/src/ecoscope-workflows-ext-wd
    editable: true

rjsf-overrides:
  properties:
    Subject Group.properties.subject_observations.properties.subject_group_name.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_client.properties.data_source.properties.name
    Group Data.properties.groupers.properties.groupers.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: spatial_feature_group
          depends_on: properties.er_client.properties.data_source.properties.name
    Group Data.properties.groupers.properties.groupers.description: ""
    Group Data.properties.groupers.properties.groupers.default:
      - index_name: subject_name
    Group Data.properties.groupers.properties.groupers.items.anyOf:
      - $ref: "#/$defs/TemporalGrouper"
      - $ref: "#/$defs/ValueGrouper"
    Filter Data.properties.subject_filters.title: ""
    Home Range Method.properties.home_range_rings_correction.properties.var.title: Fix Overlapping Percentile Transparency
    Home Range Method.properties.home_range_rings_correction.properties.var.description: >-
      Home-range percentile polygons are cumulative and nested (the 90% area fully
      contains the 50% area, and so on), so when rendered with transparency, the
      overlapping regions stack and look more opaque than areas covered by only one
      percentile band. This is most noticeable at low opacity. Enabling this
      converts the nested polygons into non-overlapping rings first, so opacity
      renders uniformly across the map.
    Home Range Method.properties.home_range_rings_correction.properties.var.default: false
    Home Range Method.properties.home_range_rings_correction.properties.var.ecoscope:advanced: true
    home_range_legend_title.properties.var.title: Legend Title
    home_range_legend_title.properties.var.description: >-
      The title shown above the percentile color legend on the map.
    home_range_legend_title.properties.var.default: Home Range %
    home_range_legend_title.properties.var.ecoscope:advanced: true
    persist_etd_pct_grouped.description: >-
      File formats to export the home range percentile-area data in.
    persist_etd_pct_grouped.properties.filetypes.ecoscope:advanced: true
    persist_etd_pct_grouped.properties.filetypes.items.enum:
      - csv
      - parquet
  $defs:
    # Restrict grouping to subject attributes that actually exist on the trajectory
    # (after the rename step below), matching the subject-tracking workflow.
    ValueGrouper.properties.index_name.oneOf:
      - const: subject_name
        title: Subject Name
      - const: subject_subtype
        title: Subject Subtype
      - const: subject_sex
        title: Subject Sex
  uiSchema:
    # Positional, matching the narrowed schema anyOf order above: TemporalGrouper,
    # ValueGrouper (SpatialGrouper removed).
    Group Data.groupers.groupers.items.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
    base_map_defs.base_maps.items.ui:options.label: false
    # Hide the redundant fieldset legend (e.g. "Elliptical Time-Density (ETD)") that
    # repeats what the Method dropdown above it already shows selected. Same fix
    # nested one level deeper for Grid Cell Size (auto_scale_or_custom_cell_size,
    # ETD-only) - its own anyOf shows the same "Auto-scale"/"Customize" redundancy.
    # This array is positional, matching the schema's own anyOf order exactly:
    # McpMethodArgs (index 0, plain), EtdMethodArgs (index 1, has the nested Grid
    # Cell Size override), BbmmMethodArgs (index 2, plain).
    Home Range Method.home_range_args.args.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
        auto_scale_or_custom_cell_size:
          ui:options:
            label: false
          anyOf:
            - ui:options:
                label: false
            - ui:options:
                label: false
      - ui:options:
          label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y"

  # ── Fetch & Prepare Trajectory ────────────────────────────────────────────
  #
  # `subject_group_name` is left unset here so it becomes a live-populated
  # dropdown of real subject groups from the connected EarthRanger server (see
  # the `ecoscope:transform` override above), instead of a hand-typed string.

  - title: Subject Group
    type: task-group
    description: Choose the EarthRanger subject group to compute a home range for.
    tasks:
      - name: null
        id: subject_observations
        task: get_subjectgroup_observations
        partial:
          filter: clean
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          raise_on_empty: true
          include_details: false
          include_subjectsource_details: false

  - title: Filter Data
    type: task-group
    description: ""
    tasks:
      - name: Filters
        id: subject_filters
        task: ecoscope.platform.tasks.config.set_traj_filters

  - id: bounding_box
    task: ecoscope.platform.tasks.config.get_bounding_box
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - id: filter_point_coords
    task: ecoscope.platform.tasks.config.get_filter_point_coords
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - id: segment_filter
    task: ecoscope.platform.tasks.config.get_segment_filter
    partial:
      filters: ${{ workflow.subject_filters.return }}

  - name: Filter by Bounding Box
    id: subject_obs_filtered
    task: apply_reloc_coord_filter
    partial:
      df: ${{ workflow.subject_observations.return }}
      bounding_box: ${{ workflow.bounding_box.return }}
      filter_point_coords: null
      roi_gdf: null
      roi_name: null
      reset_index: false

  # ── Grouping ───────────────────────────────────────────────────────────────
  #
  # Optional: split the trajectory (by subject name/subtype/sex, by time period,
  # and/or by a spatial feature group) so ETD is computed once per group instead
  # of pooling every individual in the subject group together. Left unset,
  # `set_groupers` returns `AllGrouper` and `split_groups` passes the whole
  # trajectory through as a single group - matching subject-tracking.
  #
  # `resolved_groupers` only does real work for spatial (zone-based) groupers -
  # it fetches the actual polygon boundaries so `add_spatial_index` can assign
  # each trajectory point to a zone. For plain category/time groupers it's a
  # passthrough (verified directly against `resolve_spatial_feature_groups_for_
  # spatial_groupers`'s source: it only mutates `SpatialGrouper` entries).

  - title: Group Data
    type: task-group
    description: >-
      Optionally group the data by subject, time period, or spatial feature group to
      compute the home range separately per group.
    tasks:
      - id: groupers
        task: set_groupers

      - id: spatial_group_ids
        task: extract_spatial_grouper_feature_group_names
        partial:
          groupers: ${{ workflow.groupers.return }}

      - id: fetch_spatial_feature_groups
        task: get_spatial_features_group
        partial:
          client: ${{ workflow.er_client.return }}
        map:
          argnames: spatial_features_group_name
          argvalues: ${{ workflow.spatial_group_ids.return }}

      - id: resolved_groupers
        task: resolve_spatial_feature_groups_for_spatial_groupers
        partial:
          groupers: ${{ workflow.groupers.return }}
          spatial_feature_groups: ${{ workflow.fetch_spatial_feature_groups.return }}

  - name: Transform Observations to Relocations
    id: subject_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.subject_obs_filtered.return }}
      relocs_columns:
        - groupby_col
        - fixtime
        - junk_status
        - geometry
        - extra__subject__name
        - extra__subject__subject_subtype
        - extra__subject__sex
      filter_point_coords: ${{ workflow.filter_point_coords.return }}

  - name: Convert Relocations to Trajectory
    id: subject_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.subject_reloc.return }}
      trajectory_segment_filter: ${{ workflow.segment_filter.return }}

  - name: Add Temporal Index to Trajectory
    id: traj_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.subject_traj.return }}
      time_col: segment_start
      groupers: ${{ workflow.resolved_groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Add Spatial Index to Trajectory
    id: traj_spatial_index
    task: add_spatial_index
    partial:
      gdf: ${{ workflow.traj_temporal_index.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Rename Subject Columns for Grouping
    id: subject_traj_named
    task: map_columns
    partial:
      df: ${{ workflow.traj_spatial_index.return }}
      drop_columns: []
      retain_columns: []
      rename_columns:
        extra__name: subject_name
        extra__subject_subtype: subject_subtype
        extra__sex: subject_sex
      raise_if_not_found: true

  - name: Split Trajectory by Group
    id: subject_traj_groups
    task: split_groups
    partial:
      df: ${{ workflow.subject_traj_named.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Map Base Layers
    id: base_map_defs
    task: set_base_maps

  # ── Home Range (ETD or MCP, user-selectable) ──────────────────────────────
  #
  # A single "Method" field lets the user pick ETD or MCP; only the selected
  # method's own settings are present in the submitted data - no shared
  # discriminator field, EtdMethodArgs/McpMethodArgs are told apart structurally
  # (see _meta_tasks.py). call_home_range_from_args dispatches to whichever
  # method was chosen and returns the same percentile/geometry/area_sqkm shape
  # either way, so the map/table below don't need to know or care which method
  # actually ran. The GeoTIFF raster always reuses whatever ETD parameters were
  # set (or falls back to ETD's own defaults if MCP is selected instead), since
  # MCP has no raster/UD surface of its own.

  - title: Home Range Method
    type: task-group
    description: Choose which home-range estimation method to compute for the map and table.
    tasks:
      - id: home_range_args
        task: set_home_range_args

      - id: home_range_rings_correction
        task: set_bool_var

  # MCP/BBMM have no ETD-shaped raster/UD surface, so this (and etd_raster below,
  # via its own default any_dependency_skipped condition catching this task's
  # SKIP_SENTINEL output) is skipped entirely when a non-ETD method is selected -
  # rather than silently falling back to ETD's defaults and spending real compute
  # on a file nobody configured or asked for.
  - name: Derive ETD Raster Parameters
    id: etd_raster_params
    task: get_etd_raster_params_from_args
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - any_is_non_etd_method_args
    partial:
      args: ${{ workflow.home_range_args.return }}

  - name: Generate ETD Raster per Group (GeoTIFF)
    id: etd_raster
    task: ecoscope_workflows_ext_custom.tasks.analysis.generate_etd_raster
    partial:
      combined_params: ${{ workflow.etd_raster_params.return }}
      filename: etd_home_range_raster
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    map:
      argnames:
        - group_key
        - trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  # Mirrors etd_raster_params/etd_raster above - skipped entirely unless BBMM is
  # selected. Unlike ETD, no extra combined-params fields are needed (nodata/band_count
  # aren't user-configurable for BBMM), so get_bbmm_raster_params_from_args just
  # narrows the type rather than building a separate combined-params object.
  - name: Derive BBMM Raster Parameters
    id: bbmm_raster_params
    task: get_bbmm_raster_params_from_args
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - any_is_non_bbmm_method_args
    partial:
      args: ${{ workflow.home_range_args.return }}

  - name: Generate BBMM Raster per Group (GeoTIFF)
    id: bbmm_raster
    task: generate_bbmm_raster
    partial:
      combined_params: ${{ workflow.bbmm_raster_params.return }}
      filename: bbmm_home_range_raster
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    map:
      argnames:
        - group_key
        - trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  - name: Derive Relocations per Group (for MCP points overlay)
    id: subject_reloc_groups
    task: convert_trajectory_to_relocations
    mapvalues:
      argnames: trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  - name: Calculate Home Range Percentiles per Group
    id: home_range_percentiles_grouped
    task: call_home_range_from_args
    partial:
      args: ${{ workflow.home_range_args.return }}
    mapvalues:
      argnames: trajectory_gdf
      argvalues: ${{ workflow.subject_traj_groups.return }}

  - name: Legend Title
    id: home_range_legend_title
    task: set_string_var

  - name: Get Map Opacity
    id: home_range_opacity
    task: get_home_range_opacity
    partial:
      args: ${{ workflow.home_range_args.return }}

  - name: Get Stroked Setting
    id: home_range_stroked
    task: get_stroked_from_args
    partial:
      args: ${{ workflow.home_range_args.return }}

  # ── MCP points overlay ──────────────────────────────────────────────────
  #
  # relocations_for_points_overlay returns the real relocations for MCP (the
  # literal point subset its hull was computed from) or an empty GeoDataFrame
  # for ETD (a density surface has no equivalent discrete subset) - an empty
  # GeoJSON layer renders nothing, so this stays a no-op for ETD without any
  # skipif/branching.

  - name: Filter Points to MCP Only
    id: home_range_points_gdf
    task: relocations_for_points_overlay
    partial:
      args: ${{ workflow.home_range_args.return }}
    mapvalues:
      argnames: relocations_gdf
      argvalues: ${{ workflow.subject_reloc_groups.return }}

  - name: Reproject Points for Map (WGS84)
    id: home_range_points_wgs84
    task: convert_crs
    partial:
      crs: EPSG:4326
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.home_range_points_gdf.return }}

  - name: Home Range Points Layer
    id: home_range_points_layer
    task: create_geojson_layer
    partial:
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [0, 0, 0]
        get_line_color: [0, 0, 0]
        get_line_width: 0
        get_point_radius: 1.5
        point_radius_units: pixels
        point_radius_min_pixels: 1
        opacity: 0.8
      legend: null
      tooltip_columns: null
      zoom: false
      data_url: null
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.home_range_points_wgs84.return }}

  # Per-group files, hash-named to match the dashboard's per-view "Files" tab
  # (same CompositeFilter -> hash encoding the FE uses for `views_json` keys),
  # in addition to the single combined table above.
  - name: Export Percentiles
    id: persist_etd_pct_grouped
    task: ecoscope_workflows_ext_custom.tasks.io.persist_grouped_dfs_for_results_download
    partial:
      grouped_dfs: ${{ workflow.home_range_percentiles_grouped.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: home_range_percentiles
      sanitize: false

  # ── ETD Home Range Map + Table (per group, merged into dashboard widgets) ──
  #
  # Mirrors subject-tracking's td_map_widget/td_grouped_map_widget pattern: draw
  # each group's map/table separately, persist each with an auto-generated (hash
  # based) filename since these are dashboard-only artifacts, wrap each as a
  # single-view widget, then merge all views into one widget with a view per
  # group - matching the `merge_widget_views` mechanism exactly.

  - title: Home Range Map
    type: task-group
    description: Percentile choropleth map of the home range, colored by isopleth level.
    tasks:
      - name: Apply Rings Correction (if enabled)
        id: home_range_pct_rings
        task: apply_rings_correction_if_enabled
        partial:
          enabled: ${{ workflow.home_range_rings_correction.return }}
        mapvalues:
          argnames: percentiles_gdf
          argvalues: ${{ workflow.home_range_percentiles_grouped.return }}

      - name: Cast Percentile Column
        id: etd_pct_to_string
        task: convert_column_values_to_string
        partial:
          columns:
            - percentile
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.home_range_pct_rings.return }}

      - name: Color Map - ETD Percentiles
        id: etd_pct_colormap
        task: apply_color_map
        partial:
          input_column_name: percentile
          colormap: RdYlGn_r
          output_column_name: percentile_color
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.etd_pct_to_string.return }}

      - name: Reproject ETD Percentiles for Map (WGS84)
        id: etd_pct_wgs84
        task: convert_crs
        partial:
          crs: EPSG:4326
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.etd_pct_colormap.return }}

      - name: Format Area for Display
        id: etd_pct_area_display
        task: map_values_with_unit
        partial:
          input_column_name: area_sqkm
          output_column_name: area_sqkm
          original_unit: "km²"
          new_unit: "km²"
          decimal_places: 2
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.etd_pct_wgs84.return }}

      - name: Rename Percentile/Area for Display
        id: etd_pct_display
        task: map_columns
        partial:
          drop_columns: []
          retain_columns: []
          rename_columns:
            percentile: Percentile
            area_sqkm: Area
          raise_if_not_found: true
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.etd_pct_area_display.return }}

      - name: Home Range Percentile Layer
        id: etd_pct_layer
        task: create_geojson_layer
        partial:
          layer_style:
            filled: true
            # stroked comes from get_stroked_from_args - true (black outline)
            # for MCP's few large convex hulls, false for ETD's many small raster-cell
            # fragments (a black outline on every one looked like a messy quilted mesh).
            # get_line_color/get_line_width are complete no-ops whenever stroked is false.
            stroked: ${{ workflow.home_range_stroked.return }}
            get_fill_color: percentile_color
            get_line_color: [0, 0, 0]
            get_line_width: 2
            opacity: ${{ workflow.home_range_opacity.return }}
          legend:
            title: ${{ workflow.home_range_legend_title.return }}
            label_column: Percentile
            label_suffix: " %"
            color_column: percentile_color
            sort: ascending
          tooltip_columns:
            - Percentile
            - Area
          # false (not true) so draw_map's fit-bounds fallback fires and fits to the
          # union of this layer + home_range_points_layer, rather than fitting to just
          # this layer's bounds and potentially cropping out the MCP points overlay.
          zoom: false
          data_url: null
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.etd_pct_display.return }}

      - name: Combine Percentile and Points Layers
        id: home_range_combined_layers
        task: groupbykey
        partial:
          iterables:
            - ${{ workflow.etd_pct_layer.return }}
            - ${{ workflow.home_range_points_layer.return }}

      - name: Compute Fitted Map View per Group
        id: home_range_view_state
        task: compute_fitted_view_state
        partial:
          max_zoom: 15
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.home_range_combined_layers.return }}

      - name: Combine Map Layers and Fitted View per Group
        id: home_range_map_and_view
        task: groupbykey
        partial:
          iterables:
            - ${{ workflow.home_range_combined_layers.return }}
            - ${{ workflow.home_range_view_state.return }}

      - name: Draw ETD Home Range Map per Group
        id: etd_map
        task: draw_map
        partial:
          tile_layers: ${{ workflow.base_map_defs.return }}
          static: false
          title: null
          output_type: html
          max_zoom: 15
          legend_style:
            placement: bottom-right
        mapvalues:
          argnames: [geo_layers, view_state]
          argvalues: ${{ workflow.home_range_map_and_view.return }}

      - name: Persist ETD Home Range Map (HTML) per Group
        id: persist_etd_map_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: etd_home_range_map
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.etd_map.return }}

      - name: ETD Map Widget Views
        id: etd_map_widget_views
        task: create_map_widget_single_view
        partial:
          title: "Home Range Map"
        map:
          argnames:
            - view
            - data
          argvalues: ${{ workflow.persist_etd_map_html.return }}

      - name: ETD Map Widget
        id: etd_map_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.etd_map_widget_views.return }}

  - title: Percentile Table
    type: task-group
    description: Percentile / area table for the home range, as a dashboard widget.
    tasks:
      - name: Select Percentile Table Columns
        id: etd_pct_table_columns
        task: map_columns
        partial:
          drop_columns: []
          retain_columns:
            - Percentile
            - Area
          rename_columns: {}
          raise_if_not_found: true
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.etd_pct_display.return }}

      - id: etd_pct_table
        task: draw_table
        partial:
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
            hide_header: false
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.etd_pct_table_columns.return }}

      - name: Persist ETD Percentile Table (HTML) per Group
        id: persist_etd_pct_table_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: etd_percentile_table
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.etd_pct_table.return }}

      - name: ETD Percentile Table Widget Views
        id: etd_pct_table_widget_views
        task: create_plot_widget_single_view
        partial:
          title: "Percentile Table"
        map:
          argnames:
            - view
            - data
          argvalues: ${{ workflow.persist_etd_pct_table_html.return }}

      - name: ETD Percentile Table Widget
        id: etd_pct_table_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.etd_pct_table_widget_views.return }}

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.etd_map_widget.return }}
        - ${{ workflow.etd_pct_table_widget.return }}
      groupers: ${{ workflow.resolved_groupers.return }}
      time_range: ${{ workflow.time_range.return }}
