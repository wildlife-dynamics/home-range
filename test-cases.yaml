with-bounding-box:
  name: Filter Data with Bounding Box
  description: "ETD home range filtered to a bounding box over Kenya."
  mock_io: true
  params:
    workflow_details:
      name: "Elephants ETD Home Range"
      description: "ETD home range filtered to a bounding box over Kenya."
    er_client:
      data_source:
        name: mep_dev
    time_range:
      since: "2000-01-01T00:00:00.000Z"
      until: "2020-01-01T00:00:00.000Z"
    subject_observations:
      subject_group_name: "Elephants"
    subject_filters:
      bounding_box:
        min_y: -4.7
        max_y: -0.1
        min_x: 33.6
        max_x: 40.6
      filter_point_coords: []
    groupers:
      groupers:
        - index_name: subject_name
    home_range_legend_title:
      var: "Home Range %"
    home_range_args:
      args:
        crs: "EPSG:3857"
