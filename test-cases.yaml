base:
  name: Base Test Case
  mock_io: false
  params:
    workflow_details:
      name: "Elephants ETD Home Range"
      description: "ETD home range for the Elephants subject group, grouped by subject."
    er_client:
      data_source:
        name: mep_dev
    time_range:
      since: "2000-01-01T00:00:00.000Z"
      until: "2020-01-01T00:00:00.000Z"
    subject_observations:
      subject_group_name: "Elephants"
    groupers:
      groupers:
        - index_name: subject_name
    home_range_rings_correction:
      var: false
    home_range_legend_title:
      var: "Home Range %"
    home_range_args:
      args:
        opacity: 0.7
        crs: "EPSG:3857"
        max_speed_factor: 1.05
        expansion_factor: 1.3
        percentiles: ["50", "60", "70", "80", "90", "99.999"]

